<!DOCTYPE html>
<html>
<head>
    <title>Goldi Web</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #0f0f0f;
            color: white;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            grid-template-rows: 1fr 1fr;
            height: 100vh;
        }

        .panel {
            border: 1px solid #333;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* FIXED PLACEMENT */
        .top-left { grid-column: 1; grid-row: 1; overflow-y: auto; }
        .bottom-left { grid-column: 1; grid-row: 2; }
        .middle { grid-column: 2; grid-row: 1 / span 2; }
        .top-right { grid-column: 3; grid-row: 1; }
        .bottom-right { grid-column: 3; grid-row: 2; }

        /* USERS */
        #users {
            padding: 10px;
            overflow-y: auto;
        }

        .user {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
        }

        .ticket {
            color: gold;
        }

        /* CHAT */
        .chat {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .message {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .input-box {
            display: flex;
            border-top: 1px solid #333;
        }

        input {
            flex: 1;
            padding: 10px;
            border: none;
            outline: none;
        }

        button {
            padding: 10px;
            cursor: pointer;
        }

        .row {
            display: flex;
            gap: 10px;
            padding: 10px;
        }

        .small-btn {
            flex: 1;
        }

        #startPanel {
            padding: 10px;
            overflow-y: auto;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- TOP LEFT (LOBBY USERS) -->
    <div class="panel top-left">
        <h3 style="padding:10px;margin:0;">Lobby</h3>
        <div id="users"></div>
    </div>

    <!-- BOTTOM LEFT (CONTROLS) -->
    <div class="panel bottom-left">
        <div class="row">
            <button id="readyBtn" class="small-btn">Ready</button>
            <button id="startBtn" class="small-btn">Start</button>
        </div>

        <div id="startPanel"></div>
    </div>

    <!-- MIDDLE (CHAT) -->
    <div class="panel middle" id="middlePanel">
        <div style="padding:10px;">
            <button id="loginBtn">Log in with Discord</button>
        </div>
    </div>

    <!-- RIGHT PANELS RESTORED -->
    <div class="panel top-right"></div>
    <div class="panel bottom-right"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
    getDatabase,
    ref,
    set,
    push,
    onValue,
    onChildAdded,
    update
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

/* FIREBASE */
const firebaseConfig = {
    apiKey: "AIzaSyCBanAFKnKzmPF3zzYn8rcKp9YmuzaWANE",
    authDomain: "goldi-3e679.firebaseapp.com",
    databaseURL: "https://goldi-3e679-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "goldi-3e679",
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* DISCORD */
const CLIENT_ID = "1332728969958527058";
const REDIRECT_URI = "https://best1111-dev.github.io/goldi-web/";

let currentUser = null;
let currentRoom = "lobby";

/* LOGIN */
document.addEventListener("click", (e) => {
    if (e.target && e.target.id === "loginBtn") {

        const url =
            "https://discord.com/oauth2/authorize" +
            `?client_id=${CLIENT_ID}` +
            "&response_type=token" +
            `&redirect_uri=${encodeURIComponent(REDIRECT_URI)}` +
            "&scope=identify`;

        window.location.href = url;
    }
});
/* LOAD USER */
async function loadUser() {

    const hash = new URLSearchParams(location.hash.substring(1));
    const token = hash.get("access_token");

    if (token) {
        localStorage.setItem("token", token);
        history.replaceState({}, "", location.pathname);
    }

    const saved = localStorage.getItem("token");
    if (!saved) return;

    const res = await fetch("https://discord.com/api/users/@me", {
        headers: { Authorization: `Bearer ${saved}` }
    });

    if (!res.ok) return;

    currentUser = await res.json();

    await set(ref(db, "users/" + currentUser.id), {
        name: currentUser.username,
        avatar: currentUser.avatar,
        ready: false,
        room: "lobby"
    });

    initChat();
    listenUsers();
    listenMessages();
}

/* USERS LIST */
function listenUsers() {
    onValue(ref(db, "users"), snap => {

        const data = snap.val() || {};
        const box = document.getElementById("users");
        box.innerHTML = "";

        Object.entries(data).forEach(([id, u]) => {

            const div = document.createElement("div");
            div.className = "user";

            const avatar = `https://cdn.discordapp.com/avatars/${id}/${u.avatar}.png`;

            div.innerHTML = `
                <img class="avatar" src="${avatar}">
                <div>
                    ${u.name}
                    ${u.ready ? '<span class="ticket">🎟</span>' : ''}
                </div>
            `;

            box.appendChild(div);
        });
    });
}

/* READY */
document.getElementById("readyBtn").onclick = async () => {
    if (!currentUser) return;

    const userRef = ref(db, "users/" + currentUser.id);

    const snap = await new Promise(res =>
        onValue(userRef, res, { onlyOnce: true })
    );

    update(userRef, {
        ready: !snap.val().ready
    });
};

/* START */
document.getElementById("startBtn").onclick = async () => {

    const snap = await new Promise(res =>
        onValue(ref(db, "users"), res, { onlyOnce: true })
    );

    const users = snap.val() || {};

    const ready = Object.entries(users)
        .filter(([_, u]) => u.ready);

    const panel = document.getElementById("startPanel");

    panel.innerHTML = `
        <h4>Ready Players</h4>
        ${ready.map(([id, u]) => `
            <div>${u.name}</div>
        `).join("")}

        <button id="startAnyways">Start Anyways</button>
    `;

    document.getElementById("startAnyways").onclick = () => {
        ready.forEach(([id]) => {
            update(ref(db, "users/" + id), { room: "game" });
        });

        currentRoom = "game";
        panel.innerHTML = "<b>Game started!</b>";
    };
};

/* CHAT UI */
function initChat() {

    const middle = document.getElementById("middlePanel");

    middle.innerHTML = `
        <div class="chat">

            <div class="messages" id="messages"></div>

            <div class="input-box">
                <input id="msg" placeholder="Type message...">
                <button id="send">Send</button>
            </div>

        </div>
    `;

    document.getElementById("send").onclick = sendMessage;

    document.getElementById("msg").addEventListener("keydown", e => {
        if (e.key === "Enter") sendMessage();
    });
}

/* SEND MESSAGE */
async function sendMessage() {

    const input = document.getElementById("msg");
    const text = input.value.trim();
    if (!text || !currentUser) return;

    await push(ref(db, "messages"), {
        userId: currentUser.id,
        name: currentUser.username,
        avatar: currentUser.avatar,
        room: currentRoom,
        text,
        time: Date.now()
    });

    input.value = "";
}

/* RECEIVE MESSAGES */
function listenMessages() {

    const box = document.getElementById("messages");

    onChildAdded(ref(db, "messages"), snap => {

        const m = snap.val();
        if (m.room !== currentRoom) return;

        const avatar = `https://cdn.discordapp.com/avatars/${m.userId}/${m.avatar}.png`;

        const div = document.createElement("div");
        div.className = "message";

        div.innerHTML = `
            <img class="avatar" src="${avatar}">
            <div>
                <b>${m.name}</b><br>
                ${m.text}
            </div>
        `;

        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    });
}

loadUser();

</script>

</body>
</html>
