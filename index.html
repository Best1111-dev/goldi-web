<!DOCTYPE html>
<html>
<head>
    <title>Goldi Web - Lobby</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: white;
            overflow: hidden;
        }

        /* 3-COLUMN RESPONSIVE LAYOUT CONTAINER */
        .container {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            grid-template-rows: 1fr 1fr;
            height: 100vh;
            width: 100vw;
            transition: transform 0.3s ease-out;
        }

        .panel {
            border: 1px solid #333;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: #141414;
            box-sizing: border-box;
        }

        /* GRID PLACEMENT (DESKTOP) */
        .top-left { grid-column: 1; grid-row: 1; overflow-y: auto; }
        .bottom-left { grid-column: 1; grid-row: 2; }
        .middle { grid-column: 2; grid-row: 1 / span 2; }
        .top-right { grid-column: 3; grid-row: 1; }
        .bottom-right { grid-column: 3; grid-row: 2; }

        /* USERS */
        #users {
            padding: 10px;
            overflow-y: auto;
        }

        .user {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #222;
        }

        .ticket {
            color: gold;
        }

        /* CHAT SYSTEM */
        .chat {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .message {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .input-box {
            display: flex;
            border-top: 1px solid #333;
        }

        input {
            flex: 1;
            padding: 10px;
            border: none;
            outline: none;
            background: #1a1a1a;
            color: white;
        }

        button {
            padding: 10px;
            cursor: pointer;
            background: #333;
            color: white;
            border: 1px solid #444;
        }

        button:hover {
            background: #444;
        }

        .row {
            display: flex;
            gap: 10px;
            padding: 10px;
        }

        .small-btn {
            flex: 1;
        }

        #startPanel {
            padding: 10px;
            overflow-y: auto;
        }

        /* MOBILE STATUS HUD INDICATORS */
        .mobile-hud {
            display: none;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
            justify-content: space-around;
            padding: 10px 0;
            font-size: 12px;
            font-weight: bold;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            z-index: 5000;
            height: 40px;
            box-sizing: border-box;
        }
        .hud-pill { color: #666; text-transform: uppercase; }
        .hud-pill.active { color: gold; }

        /* MOBILE LAYOUT STRATEGY OVERRIDES */
        @media (max-width: 768px) {
            body { position: fixed; width: 100vw; height: 100vh; }
            .mobile-hud { display: flex; }
            
            .container {
                display: flex;
                width: 300vw; /* Creates three full width structural view tracks */
                height: calc(100vh - 40px);
                margin-top: 40px;
                transform: translateX(-100vw); /* Focus defaults on Middle Panel view */
            }

            .left-track, .middle-track, .right-track {
                width: 100vw;
                height: 100%;
                display: flex;
                flex-direction: column;
                flex-shrink: 0;
            }

            .panel { flex: 1; height: 50%; border: none; border-bottom: 1px solid #222; }
            .middle-track .panel { height: 100%; }
        }
    </style>
</head>
<body>

<div class="mobile-hud" id="mobileHud">
    <span class="hud-pill" id="pill-0">Lobby Room</span>
    <span class="hud-pill active" id="pill-1">Global Chat</span>
    <span class="hud-pill" id="pill-2">Extra Specs</span>
</div>

<div class="container" id="swipeContainer">
    <div class="left-track">
        <div class="panel top-left">
            <h3 style="padding:10px;margin:0;">Lobby</h3>
            <div id="users"></div>
        </div>
        <div class="panel bottom-left">
            <div class="row">
                <button id="readyBtn" class="small-btn">Ready</button>
                <button id="startBtn" class="small-btn">Start</button>
            </div>
            <div id="startPanel"></div>
        </div>
    </div>

    <div class="middle-track">
        <div class="panel middle" id="middlePanel">
            <div style="padding:10px;">
                <button id="loginBtn">Log in with Discord</button>
            </div>
        </div>
    </div>

    <div class="right-track">
        <div class="panel top-right"></div>
        <div class="panel bottom-right"></div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
    getDatabase, ref, set, push, onValue, onChildAdded, update
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyCBanAFKnKzmPF3zzYn8rcKp9YmuzaWANE",
    authDomain: "goldi-3e679.firebaseapp.com",
    databaseURL: "https://goldi-3e679-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "goldi-3e679",
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const CLIENT_ID = "1332728969958527058";
const REDIRECT_URI = "https://best1111-dev.github.io/goldi-web/";

let currentUser = null;
let currentRoom = "lobby";

document.addEventListener("click", (e) => {
    if (e.target && e.target.id === "loginBtn") {
        const url =
            "https://discord.com/oauth2/authorize" +
            `?client_id=${CLIENT_ID}` +
            `&response_type=token` +
            `&redirect_uri=${encodeURIComponent(REDIRECT_URI)}` +
            "&scope=identify";
        window.location.href = url;
    }
});

loadUser();

async function loadUser() {
    const hash = new URLSearchParams(location.hash.substring(1));
    const token = hash.get("access_token");

    if (token) {
        localStorage.setItem("token", token);
        history.replaceState({}, "", location.pathname);
    }

    const saved = localStorage.getItem("token");
    if (!saved) return;

    try {
        const targetUrl = "https://discord.com/api/users/@me";
        const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(targetUrl);

        const res = await fetch(proxyUrl, {
            headers: { Authorization: `Bearer ${saved}` }
        });

        if (!res.ok) throw new Error("Discord API rejected request or token expired");

        currentUser = await res.json();
        if (!currentUser) return;

        localStorage.setItem("myId", currentUser.id);
        localStorage.setItem("myName", currentUser.username);

        const userAvatar = currentUser.avatar || "";

        await set(ref(db, "users/" + currentUser.id), {
            name: currentUser.username,
            avatar: userAvatar,
            ready: false,
            room: "lobby"
        });

        initChat();
        listenUsers();
        listenMessages();
        listenForGameStart();
        setupMobileSwipeEngine();
        
    } catch (err) {
        console.error("Login verification stalled:", err);
        localStorage.removeItem("token");
        localStorage.removeItem("myId");
        localStorage.removeItem("myName");
    }
}

function listenForGameStart() {
    if (!currentUser) return;
    const userRoomRef = ref(db, `users/${currentUser.id}/room`);
    onValue(userRoomRef, (snap) => {
        if (snap.val() === "game") {
            window.location.href = "game.html";
        }
    });
}

function listenUsers() {
    onValue(ref(db, "users"), snap => {
        const data = snap.val() || {};
        const box = document.getElementById("users");
        if (!box) return;
        box.innerHTML = "";

        Object.entries(data).forEach(([id, u]) => {
            if (!u) return;

            const div = document.createElement("div");
            div.className = "user";

            const avatar = u.avatar 
                ? `https://cdn.discordapp.com/avatars/${id}/${u.avatar}.png` 
                : `https://cdn.discordapp.com/embed/avatars/0.png`;

            div.innerHTML = `
                <img class="avatar" src="${avatar}">
                <div>
                    ${u.name || "Unknown User"}
                    ${u.ready ? '<span class="ticket">🎟</span>' : ''}
                </div>
            `;
            box.appendChild(div);
        });
    });
}

document.getElementById("readyBtn").onclick = async () => {
    if (!currentUser) return;
    const userRef = ref(db, "users/" + currentUser.id);
    const snap = await new Promise(res => onValue(userRef, res, { onlyOnce: true }));
    const currentData = snap.val() || { ready: false };
    update(userRef, { ready: !currentData.ready });
};

document.getElementById("startBtn").onclick = async () => {
    const snap = await new Promise(res => onValue(ref(db, "users"), res, { onlyOnce: true }));
    const users = snap.val() || {};
    const totalPlayers = Object.entries(users).filter(([_, u]) => u && u.room === "lobby");
    const panel = document.getElementById("startPanel");

    panel.innerHTML = `
        <h4>Players in Lobby</h4>
        ${totalPlayers.map(([id, u]) => `<div>${u.name} ${u.ready ? '✓' : '(Not Ready)'}</div>`).join("")}
        <button id="startAnyways" style="margin-top:10px;">Start Anyways</button>
    `;

    document.getElementById("startAnyways").onclick = async () => {
        const gameLaunchUpdates = {};
        
        // Clear active room game parameters across atomic updates
        gameLaunchUpdates["gameState/isGameInProgress"] = true;

        totalPlayers.forEach(([id]) => {
            gameLaunchUpdates[`users/${id}/room`] = "game";
            gameLaunchUpdates[`users/${id}/ready`] = true;
        });

        await update(ref(db), gameLaunchUpdates);
        currentRoom = "game";
        panel.innerHTML = "<b>Game started!</b>";
    };
};

function initChat() {
    const middle = document.getElementById("middlePanel");
    if (!middle) return;

    middle.innerHTML = `
        <div class="chat">
            <div class="messages" id="messages"></div>
            <div class="input-box">
                <input id="msg" placeholder="Type message...">
                <button id="send">Send</button>
            </div>
        </div>
    `;

    document.getElementById("send").onclick = sendMessage;
    document.getElementById("msg").addEventListener("keydown", e => {
        if (e.key === "Enter") sendMessage();
    });
}

async function sendMessage() {
    const input = document.getElementById("msg");
    if (!input) return;
    const text = input.value.trim();
    if (!text || !currentUser) return;

    await push(ref(db, "messages"), {
        userId: currentUser.id,
        name: currentUser.username,
        avatar: currentUser.avatar || "",
        room: currentRoom,
        text,
        time: Date.now()
    });
    input.value = "";
}

function listenMessages() {
    const box = document.getElementById("messages");
    onChildAdded(ref(db, "messages"), snap => {
        const m = snap.val();
        if (!m || m.room !== currentRoom || !box) return;

        const avatar = m.avatar 
            ? `https://cdn.discordapp.com/avatars/${m.userId}/${m.avatar}.png` 
            : `https://cdn.discordapp.com/embed/avatars/0.png`;

        const div = document.createElement("div");
        div.className = "message";
        div.innerHTML = `
            <img class="avatar" src="${avatar}">
            <div>
                <b>${m.name || "System"}</b><br>
                ${m.text}
            </div>
        `;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    });
}

/* MOBILE SURFACE TOUCH SWIPE CONTROLLER */
function setupMobileSwipeEngine() {
    const track = document.getElementById("swipeContainer");
    const pills = [document.getElementById("pill-0"), document.getElementById("pill-1"), document.getElementById("pill-2")];
    let currentTrackIndex = 1; // Center Panel view focus default
    let touchStartX = 0;
    let touchEndX = 0;

    function applyTrackShift() {
        if (window.innerWidth > 768) {
            track.style.transform = "none";
            return;
        }
        const shiftAmount = -currentTrackIndex * 100;
        track.style.transform = `translateX(${shiftAmount}vw)`;
        pills.forEach((p, i) => {
            if (i === currentTrackIndex) p.classList.add("active");
            else p.classList.remove("active");
        });
    }

    window.addEventListener("touchstart", e => {
        if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
        touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    window.addEventListener("touchend", e => {
        if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
        touchEndX = e.changedTouches[0].screenX;
        
        const threshold = 50;
        if (touchStartX - touchEndX > threshold) { // Swipe Left
            if (currentTrackIndex < 2) { currentTrackIndex++; applyTrackShift(); }
        } else if (touchEndX - touchStartX > threshold) { // Swipe Right
            if (currentTrackIndex > 0) { currentTrackIndex--; applyTrackShift(); }
        }
    }, { passive: true });

    window.addEventListener("resize", applyTrackShift);
}
</script>
</body>
</html>
