<!DOCTYPE html>
<html>
<head>
    <title>Goldi Web - Entrance</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background: #141414;
            border: 1px solid #333;
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 360px;
            box-sizing: border-box;
            text-align: center;
            margin: 15px;
        }
        h2 { margin-top: 0; color: #d4af37; letter-spacing: 1px; }
        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #1e1e1e;
            color: white;
            box-sizing: border-box;
            font-size: 16px;
        }
        input:focus { outline: none; border-color: #d4af37; }
        button {
            background: #d4af37;
            color: black;
            font-weight: bold;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s;
        }
        button:hover { background: white; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>GOLDI ONLINE</h2>
    <p style="color: #aaa; font-size: 14px;">Enter your identity parameters to establish connection link</p>
    <input id="nameInp" placeholder="Username / Handle" autocomplete="off">
    <button id="enterBtn">Connect to System</button>
</div>

<script>
    document.getElementById("enterBtn").onclick = () => {
        const name = document.getElementById("nameInp").value.trim();
        if(!name) { alert("Please input a valid username!"); return; }
        
        // Generate a random stable unique ID if one doesn't exist
        if(!localStorage.getItem("myId")) {
            localStorage.setItem("myId", "usr_" + Math.random().toString(36).substring(2, 11));
        }
        localStorage.setItem("myName", name);
        window.location.href = "game.html";
    };
</script>
</body>
</html>
