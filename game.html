<!DOCTYPE html>
<html>
<head>
    <title>Goldi Web - The Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: white;
            user-select: none;
            overflow: hidden;
        }

        /* RESPONSIVE LAYOUT DECK CONTAINER */
        .container {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            grid-template-rows: 1fr 1fr;
            height: 100vh;
            width: 100vw;
            transition: transform 0.3s ease-out;
        }

        .panel {
            border: 1px solid #333;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: #141414;
            box-sizing: border-box;
        }

        /* 5-PANEL GRID ARCHITECTURE (DESKTOP) */
        .top-left { grid-column: 1; grid-row: 1; }
        .bottom-left { grid-column: 1; grid-row: 2; }
        .middle { grid-column: 2; grid-row: 1 / span 2; }
        .top-right { grid-column: 3; grid-row: 1; }
        .bottom-right { grid-column: 3; grid-row: 2; }

        .panel-header {
            background: #222;
            padding: 10px;
            font-weight: bold;
            font-size: 14px;
            border-bottom: 1px solid #333;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        /* TIMER BAR */
        .timer-banner {
            background: #a31d1d;
            padding: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
        }
        .timer-banner.day { background: #d4af37; color: black; }

        /* LISTS & BUTTONS */
        .target-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            background: #1e1e1e;
            margin-bottom: 6px;
            border-radius: 4px;
            border: 1px solid #2a2a2a;
            gap: 5px;
        }
        .target-btn {
            background: #c99700;
            color: black;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 3px;
        }
        .target-btn:hover { background: #fff; }
        .target-btn:disabled { background: #444; color: #888; cursor: not-allowed; }
        
        .judge-btn {
            background: #bd0000;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 3px;
        }
        .judge-btn:hover { background: #ff4d4d; }

        /* CHATS INTERFACE VISUAL STYLE */
        .chat-wrap { display: flex; flex-direction: column; height: 100%; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; background: #0b0b0b; }
        .chat-input-row { display: flex; border-top: 1px solid #252525; background: #141414; }
        .chat-input-row input { flex: 1; padding: 14px; border: none; background: #181818; color: white; outline: none; font-size: 15px; width: 50px; }
        .chat-input-row button { padding: 14px 24px; background: #c99700; color: black; font-weight: bold; border: none; cursor: pointer; font-size: 14px; }
        .chat-input-row button:hover { background: #fff; }

        .msg { 
            display: flex; 
            align-items: flex-start; 
            gap: 14px; 
            margin-bottom: 20px; 
        }
        .msg-avatar { 
            width: 44px; 
            height: 44px; 
            border-radius: 50%; 
            background: #2a2a2a; 
            flex-shrink: 0; 
            object-fit: cover; 
            border: 1px solid #333;
        }
        .msg-content-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .msg-username {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            line-height: 1.2;
        }
        .msg-text {
            font-size: 15px;
            color: #e5e5e5;
            word-break: break-word;
            line-height: 1.3;
        }
        
        .msg.sys { display: block; color: #00ffcc; font-weight: bold; font-size: 14px; padding: 6px 0; border-bottom: 1px dashed #222; }
        .msg.vamp .msg-username { color: #ff4444; }
        .msg.priv { font-style: italic; opacity: 0.65; }

        /* WILLS & WIKI */
        textarea.will-box {
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            color: #f0e68c;
            border: none;
            resize: none;
            outline: none;
            box-sizing: border-box;
            font-family: monospace;
            padding: 5px;
        }
        .wiki-output {
            background: #090909;
            border: 1px solid #222;
            padding: 8px;
            height: calc(100% - 45px);
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.4;
            color: #ccc;
            white-space: pre-wrap;
        }

        /* COURT DISPLAY */
        .court-box {
            background: #262626;
            padding: 15px;
            border: 2px solid #d4af37;
            text-align: center;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        .court-btns { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn-guilty { background: #ff3333; color: white; border: none; padding: 8px 20px; font-weight: bold; cursor: pointer; }
        .btn-innocent { background: #33cc33; color: white; border: none; padding: 8px 20px; font-weight: bold; cursor: pointer; }
        .btn-lawyer { background: #9400d3; color: white; border: none; padding: 8px 20px; font-weight: bold; cursor: pointer; }

        /* OVERLAYS */
        .game-over-box {
            background: rgba(0,0,0,0.98);
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex; flex-direction: column;
            justify-content: flex-start; align-items: center;
            z-index: 9999;
            text-align: center;
            overflow-y: auto;
            padding: 40px 20px;
            box-sizing: border-box;
        }
        .game-over-title { font-size: 40px; color: gold; font-weight: bold; margin-bottom: 15px; }
        .lobby-return-btn { background: #d4af37; color: black; border: none; padding: 14px 32px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 6px; text-transform: uppercase; margin-bottom: 30px; }
        .lobby-return-btn:hover { background: #fff; box-shadow: 0 0 15px rgba(255,255,255,0.4); }
        
        .manifest-container {
            width: 100%;
            max-width: 800px;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            text-align: left;
            margin-top: 10px;
        }
        .manifest-section { margin-bottom: 20px; }
        .manifest-section h4 { margin: 0 0 10px 0; font-size: 18px; border-bottom: 1px solid #444; padding-bottom: 4px; }
        .manifest-section.vills h4 { color: #5dade2; }
        .manifest-section.vamps h4 { color: #ec7063; }
        .manifest-section.neuts h4 { color: #f4d03f; }
        .manifest-player { padding: 4px 0; font-size: 15px; font-family: monospace; }
        
        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
        }

        /* MOBILE HUD NAV INDICATOR PILLS */
        .mobile-nav-hud {
            display: none;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
            justify-content: space-around;
            padding: 10px 0;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .hud-pill { color: #666; text-transform: uppercase; padding: 2px 8px; border-radius: 10px; }
        .hud-pill.active { color: #d4af37; background: #2a220a; }

        /* MOBILE VIEWPORTS OVERRIDE CONFIGURATION */
        @media (max-width: 768px) {
            body { overflow: hidden; position: fixed; width: 100vw; height: 100vh; }
            .mobile-nav-hud { display: flex; position: fixed; top: 0; left: 0; width: 100vw; z-index: 5000; height: 38px; box-sizing: border-box; }
            
            .container {
                display: flex;
                width: 300vw; /* 3 Full Horizontal swipe tracks */
                height: calc(100vh - 38px);
                margin-top: 38px;
                transform: translateX(-100vw); /* Default center on the Middle Deck */
            }

            /* Stack sections vertically within tracks to preserve full UI features */
            .left-track, .middle-track, .right-track {
                width: 100vw;
                height: 100%;
                display: flex;
                flex-direction: column;
                flex-shrink: 0;
            }

            .panel { flex: 1; height: 50%; border: none; border-bottom: 1px solid #222; }
            .middle-track .panel { height: 100%; }
        }
    </style>
</head>
<body>

<div class="mobile-nav-hud" id="mobileHud">
    <span class="hud-pill" id="pill-0">Actions</span>
    <span class="hud-pill active" id="pill-1">Chat Logs</span>
    <span class="hud-pill" id="pill-2">Grimoire</span>
</div>

<div id="gameOverScreen" class="game-over-box" style="display:none;">
    <div class="game-over-title" id="victoryBanner">VICTORY ACHIEVED!</div>
    <button class="lobby-return-btn" id="returnToLobbyBtn">Return to Lobby & Wipe Match</button>
    <div class="manifest-container" id="victoryManifest"></div>
</div>

<div class="container" id="swipeContainer">
    <div class="left-track">
        <div class="panel top-left">
            <div class="panel-header" id="topLeftHeader">Interaction Panel</div>
            <div class="panel-body" id="topLeftBody">Loading panel access...</div>
        </div>
        <div class="panel bottom-left">
            <div class="panel-header" id="bottomLeftHeader">Identity Context</div>
            <div class="panel-body" id="bottomLeftBody" style="padding:0; display:flex; flex-direction:column; height:100%;">Loading channel access...</div>
        </div>
    </div>

    <div class="middle-track">
        <div class="panel middle">
            <div id="timerBanner" class="timer-banner">SYNCING STATE...</div>
            <div class="panel-body" style="padding:0;">
                <div class="chat-wrap">
                    <div class="chat-messages" id="mainChatMsgs"></div>
                    <div id="courtArea"></div>
                    <div class="chat-input-row" id="mainChatInputRow">
                        <input id="mainChatInp" placeholder="Type to global chat..." autocomplete="off">
                        <button id="mainChatSend">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="right-track">
        <div class="panel top-right">
            <div class="panel-header">Personal Testament (Will)</div>
            <div class="panel-body" style="padding:0;">
                <textarea id="willTextarea" class="will-box" placeholder="Your testament will be published automatically upon your elimination..."></textarea>
            </div>
        </div>
        <div class="panel bottom-right">
            <div class="panel-header">Grimoire Database (Wiki)</div>
            <div class="panel-body" style="padding:0; display:flex; flex-direction:column; height:100%;">
                <div class="wiki-output" id="wikiOut">Type "guide", "priority list", or any Role Name below to query information data.</div>
                <div class="chat-input-row">
                    <input id="wikiInp" placeholder="Query keyword..." autocomplete="off">
                    <button id="wikiSend">Query</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
    getDatabase, ref, set, push, onValue, update, runTransaction, get, onChildAdded, remove
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

/* FIREBASE INITIALIZATION */
const firebaseConfig = {
    apiKey: "AIzaSyCBanAFKnKzmPF3zzYn8rcKp9YmuzaWANE",
    authDomain: "goldi-3e679.firebaseapp.com",
    databaseURL: "https://goldi-3e679-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "goldi-3e679",
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let myId = null;
let myProfile = null;
let playersCache = {};
let currentPhase = "";
let isHost = false;
let witchPotionThisNight = "";
let hasVotedToday = false;
let resetInProgress = false;

const ROLE_DATA = {
    "confusion vampire": { p: 1, side: "vampire", icon: "🌀", desc: "Choose 1 target at night. Switch the target of their action to another random player." },
    "ice cream maker": { p: 2, side: "villager", icon: "🍦", desc: "Freeze 1 target at night to prevent them from taking action. Must rest 1 night after use." },
    "troll": { p: 3, side: "neutral", icon: "🧌", desc: "Choose 1 player at night. If they visited someone, they die. If they stayed home, they discover who you are." },
    "witch": { p: 4, side: "villager", icon: "🧙‍♀️", desc: "Draws a random potion at dusk (Useless, Poison, Invisibility). Poison kills target; Invisibility blocks all visits to target." },
    "doctor": { p: 4.5, side: "villager", icon: "🩺", desc: "Visit 1 player per night. If that player is attacked on the same night, they are saved. Cannot choose the same person on consecutive nights." },
    "spirit artist": { p: 4.6, side: "villager", icon: "🎨", desc: "Choose 1 person each night to make invisible. Cannot choose the same person on consecutive nights." },
    "holy knight": { p: 5, side: "villager", icon: "🛡️", desc: "Guard 1 target. If Vampire Progenitor visits, both die. If any other vampire visits, their action is canceled." },
    "vampire progenitor": { p: 6, side: "vampire", icon: "🩸", desc: "Select 1 target to kill each night." },
    "hunter": { p: 7, side: "villager", icon: "🏹", desc: "Choose 1 player to kill each night. If you kill a fellow villager, you commit suicide out of guilt." },
    "vampire lawyer": { p: 8, side: "vampire", icon: "⚖️", desc: "Day ability: If a court trial is active, vote innocent to end the trial instantly and force Nightfall (Once per game)." },
    "judge": { p: 8.2, side: "villager", icon: "🔨", desc: "Day ability: Click the 'Judge' button next to a player to execute them instantly and force Night phase. If you execute a villager, you are killed by the executioner." },
    "pokemon trainer": { p: 8.5, side: "neutral", icon: "🧢", desc: "Visit 1 player per night. If Progenitor, you die. Otherwise catch a Pokémon. At 5 catches, you become Champion." },
    "pokemon champion": { p: 8.6, side: "villager", icon: "🏆", desc: "Send 1 pokemon out each night to kill 1 player." },
    "detective": { p: 9, side: "villager", icon: "🔍", desc: "Investigate 1 target at night to reveal whether they are a Vampire." },
    "investigator": { p: 10, side: "villager", icon: "📋", desc: "Compare 2 targets at night to find out if they belong to the same faction alignment." },
    "psychic": { p: 11, side: "villager", icon: "🔮", desc: "Link 2 players at night. They will privately discover each other's roles via a system notification." },
    "seer vampire": { p: 12, side: "vampire", icon: "👁️", desc: "Peer into a player's mind at night to reveal their exact identity card directly." },
    "spy": { p: 13, side: "villager", icon: "👣", desc: "Track 1 player at night to identify who they went out to visit." },
    "stalker": { p: 14, side: "villager", icon: "📹", desc: "Watch 1 player at night to catch everyone who came to visit them." },
    "jester": { p: 15, side: "neutral", icon: "🃏", desc: "Trick the town into executing you during the Day Court trial. If you are lynched, you win immediately." },
    "dragoon": { p: 16, side: "neutral", icon: "🐉", desc: "Pick 1 player per night to feed to the dragon (kills target). If nominated during the day, you die instantly. Goal: Feed 2 vamps and 2 vills to dragon. Only appears in 10+ player matches." },
    "rando": { p: 17, side: "neutral", icon: "🎲", desc: "If the Vampire Progenitor attacks you at night, the Progenitor dies instead, and you transform into the new Vampire Progenitor." },
    "inflator": { p: 18, side: "neutral", icon: "🎈", desc: "Target 1 player each night to permanently append 1 extra voting credit weight to them. Goal: Let someone get nominated by a vote count exactly equal to the match's initial player count." }
};

bootstrapGame();

async function bootstrapGame() {
    myId = localStorage.getItem("myId");
    const myStoredName = localStorage.getItem("myName");
    const myStoredAvatar = localStorage.getItem("myAvatar") || "";

    if (!myId || !myStoredName) { 
        window.location.href = "index.html"; 
        return; 
    }

    setupWiki();
    setupMobileSwipeGestures();
    syncGameEngine();
}

function syncGameEngine() {
    const myStoredName = localStorage.getItem("myName");
    const myStoredAvatar = localStorage.getItem("myAvatar") || "";

    onValue(ref(db, "users"), async (snap) => {
        if (resetInProgress) return;
        let users = snap.val() || {};
        
        if (!users[myId]) {
            const myReentry = {};
            myReentry[`users/${myId}`] = { name: myStoredName, room: "game", alive: true, ready: true, avatar: myStoredAvatar };
            await update(ref(db), myReentry);
            return;
        }

        const sortedIds = Object.keys(users).sort();
        isHost = (sortedIds[0] === myId);

        // --- EXTENDED PLAYER NPC SEED STAGING ---
        if (isHost && Object.keys(users).length === 1 && currentPhase !== "game_over") {
            const npcUpdates = {};
            const mockRoles = ["vampire progenitor", "jester", "doctor", "pokemon trainer", "judge", "spirit artist", "dragoon", "rando", "inflator"];
            for (let i = 1; i <= 9; i++) {
                let suffix = i === 1 ? "alpha" : i === 2 ? "beta" : i === 3 ? "gamma" : i === 4 ? "delta" : `bot_${i}`;
                npcUpdates[`users/npc_${suffix}`] = { 
                    name: `NPC ${suffix.toUpperCase().replace("_", " ")}`, 
                    room: "game", 
                    alive: true, 
                    ready: true, 
                    role: mockRoles[i-1] || "hunter", 
                    avatar: "" 
                };
            }
            npcUpdates[`users/${myId}`] = { name: myStoredName, room: "game", alive: true, ready: true, avatar: myStoredAvatar };
            
            await update(ref(db), npcUpdates);
            return; 
        }

        playersCache = users;
        myProfile = users[myId];

        // FIXED CRITICAL RELOAD PERSISTENCE INJECTION HOOK:
        // Only run allocation if the entire room is unassigned, preventing role resets on reload.
        if (isHost && currentPhase !== "game_over") {
            let spaceNeedsallotment = Object.values(users).some(u => !u.role);
            if (spaceNeedsallotment) {
                allotIdentityRoles(users);
            }
        }
        
        renderIdentityPanel();
        renderInteractionGrid();
    });

    onValue(ref(db, "gameState"), snap => {
        if (resetInProgress) return;
        const state = snap.val();
        if (!state) {
            if (isHost) setupDefaultGameState();
            return;
        }
        if (currentPhase !== state.phase) {
            hasVotedToday = false; 
        }
        currentPhase = state.phase;
        updateTimerView(state.timer, state.phase);
        renderCourtDisplay(state.court);
        toggleChatInputState();
        renderInteractionGrid();

        if (state.phase === "game_over" && state.winnerMessage) {
            displayGameOverOverlay(state.winnerMessage);
        } else {
            document.getElementById("gameOverScreen").style.display = "none";
        }
    });

    setupChatChannels();
    setupLobbyReturnRoute();
}

async function setupDefaultGameState() {
    const userSnap = await get(ref(db, "users"));
    const totalCount = Object.keys(userSnap.val() || {}).length;
    
    set(ref(db, "gameState"), {
        phase: "day_voting",
        timer: 100,
        court: { active: false, targetId: "", targetName: "", guilty: 0, innocent: 0, voters: {} },
        winnerMessage: "",
        initialPlayerCount: totalCount
    });
    sendSystemLog("The simulation begins. It is Day! Discuss freely and cast your votes to execute suspected threats.");
}

function allotIdentityRoles(users) {
    const entries = Object.entries(users);
    const playerCount = entries.length;

    let pool = [];
    let chunks = Math.floor(playerCount / 5);
    let remainder = playerCount % 5;

    let eligibleRoles = { ...ROLE_DATA };
    if (playerCount < 10) {
        delete eligibleRoles["dragoon"];
    }

    let vampsPool = Object.keys(eligibleRoles).filter(r => eligibleRoles[r].side === "vampire" && r !== "vampire progenitor");
    let neutsPool = Object.keys(eligibleRoles).filter(r => eligibleRoles[r].side === "neutral");
    let villsPool = Object.keys(eligibleRoles).filter(r => eligibleRoles[r].side === "villager" && r !== "detective");

    vampsPool.sort(() => Math.random() - 0.5);
    neutsPool.sort(() => Math.random() - 0.5);
    villsPool.sort(() => Math.random() - 0.5);

    if (playerCount >= 5) {
        for (let i = 0; i < chunks; i++) {
            pool.push("vampire progenitor");
            pool.push("detective");
            if (neutsPool.length > 0) pool.push(neutsPool.pop());
            if (villsPool.length > 0) pool.push(villsPool.pop());
            if (villsPool.length > 0) pool.push(villsPool.pop());
        }
        
        let step = 0;
        while (remainder > 0) {
            if (step === 0 || step === 2 || step === 4) {
                if (villsPool.length > 0) pool.push(villsPool.pop());
                else pool.push("hunter");
            } else if (step === 1) {
                if (vampsPool.length > 0) pool.push(vampsPool.pop());
            } else if (step === 3) {
                if (neutsPool.length > 0) pool.push(neutsPool.pop());
            }
            remainder--;
            step = (step + 1) % 5;
        }
    } else {
        if (playerCount >= 1) pool.push("vampire progenitor");
        if (playerCount >= 2) pool.push("detective");
        if (playerCount >= 3 && neutsPool.length > 0) pool.push(neutsPool.pop());
        if (playerCount >= 4 && villsPool.length > 0) pool.push(villsPool.pop());
    }

    let finalUniqueRoles = [];
    let absoluteRegistry = new Set();
    
    pool.forEach(role => {
        if (!absoluteRegistry.has(role)) {
            finalUniqueRoles.push(role);
            absoluteRegistry.add(role);
        } else {
            let backup = villsPool.pop() || "hunter";
            finalUniqueRoles.push(backup);
            absoluteRegistry.add(backup);
        }
    });

    finalUniqueRoles.sort(() => Math.random() - 0.5);

    let updates = {};
    let index = 0;
    Object.keys(users).forEach(id => {
        updates[`users/${id}/role`] = finalUniqueRoles[index] || "hunter";
        updates[`users/${id}/alive`] = true;
        updates[`users/${id}/voteBonusCount`] = 0;
        index++;
    });

    update(ref(db), updates);
}

/* MOBILE SWIPE INTERACTION DETECTOR */
function setupMobileSwipeGestures() {
    const trackContainer = document.getElementById("swipeContainer");
    const pills = [document.getElementById("pill-0"), document.getElementById("pill-1"), document.getElementById("pill-2")];
    let currentTrackIndex = 1; // Start focused squarely on Middle Panel (index 1)
    
    let touchStartX = 0;
    let touchEndX = 0;

    function applyMobileTrackShift() {
        if (window.innerWidth > 768) {
            trackContainer.style.transform = "none";
            return;
        }
        const displacementValue = -currentTrackIndex * 100;
        trackContainer.style.transform = `translateX(${displacementValue}vw)`;
        
        // Synchronize display indicators
        pills.forEach((p, idx) => {
            if (idx === currentTrackIndex) p.classList.add("active");
            else p.classList.remove("active");
        });
    }

    window.addEventListener("touchstart", e => {
        // Direct tap exclusion for textareas/inputs to prevent keyboard overlay interference
        if(e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
        touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    window.addEventListener("touchend", e => {
        if(e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
        touchEndX = e.changedTouches[0].screenX;
        
        const dragThreshold = 60;
        if (touchStartX - touchEndX > dragThreshold) {
            // Swiped Left -> Advance view rightwards
            if (currentTrackIndex < 2) {
                currentTrackIndex++;
                applyMobileTrackShift();
            }
        } else if (touchEndX - touchStartX > dragThreshold) {
            // Swiped Right -> Pull view leftwards
            if (currentTrackIndex > 0) {
                currentTrackIndex--;
                applyMobileTrackShift();
            }
        }
    }, { passive: true });

    window.addEventListener("resize", applyMobileTrackShift);
}

function updateTimerView(seconds, phase) {
    const banner = document.getElementById("timerBanner");
    if (!banner) return;
    if (phase === "game_over") {
        banner.textContent = "SIMULATION CONCLUDED";
        banner.className = "timer-banner";
        return;
    }
    let displayPhase = phase.toUpperCase().replace("_", " ");
    banner.textContent = `${displayPhase} PHASE — TIME REMAINING: ${seconds}s`;
    if (phase.startsWith("day")) {
        banner.className = "timer-banner day";
    } else {
        banner.className = "timer-banner";
    }

    if (isHost && seconds <= 0) {
        handlePhaseTimeout();
    }
}

if (!window.timerIntervalHooked) {
    window.timerIntervalHooked = true;
    setInterval(() => {
        if (!isHost || !currentPhase || currentPhase === "game_over" || resetInProgress) return;
        runTransaction(ref(db, "gameState/timer"), (currentTimer) => {
            if (currentTimer === null) return 0;
            return currentTimer - 1;
        });
    }, 1000);
}

function handlePhaseTimeout() {
    if (currentPhase === "day_voting") {
        evaluateVotingTally();
    } else if (currentPhase === "day_court") {
        resolveCourtVerdict();
    } else if (currentPhase === "night") {
        processNightActions();
    }
}

/* DAY PHASE COMPUTATIONS */
async function evaluateVotingTally() {
    if (resetInProgress) return;
    const snap = await get(ref(db, "votes"));
    const votes = snap.val() || {};
    const tallies = {};
    
    let activePlayersCount = Object.values(playersCache).filter(p => p.alive).length;
    let threshold = Math.ceil(activePlayersCount * 0.5);

    Object.entries(votes).forEach(([voterId, tId]) => {
        const bonusWeight = playersCache[voterId]?.voteBonusCount || 0;
        tallies[tId] = (tallies[tId] || 0) + 1 + bonusWeight;
    });

    let courtTargetId = null;
    Object.entries(tallies).forEach(([tId, count]) => {
        if (count >= threshold) courtTargetId = tId;
    });

    if (courtTargetId) {
        if (playersCache[courtTargetId]?.role === "dragoon") {
            sendSystemLog(`🔥 DRAGOON NOMINATED! ${playersCache[courtTargetId].name.toUpperCase()} was nominated by the town during the day, triggering instant immolation!`);
            await executePlayerDeath(courtTargetId);
            
            if (currentPhase !== "game_over") {
                update(ref(db, "gameState"), { phase: "night", timer: 40, court: { active: false } });
            }
        } else {
            sendSystemLog(`The village reached a consensus! ${playersCache[courtTargetId].name} is sent to stand trial in court.`);
            update(ref(db, "gameState"), {
                phase: "day_court",
                timer: 100,
                court: {
                    active: true,
                    targetId: courtTargetId,
                    targetName: playersCache[courtTargetId].name,
                    guilty: 0,
                    innocent: 0,
                    voters: {}
                }
            });
        }
    } else {
        sendSystemLog("The town failed to reach consensus. Night descends...");
        update(ref(db, "gameState"), { phase: "night", timer: 40, court: { active: false } });
    }
    set(ref(db, "votes"), null);
}

async function resolveCourtVerdict() {
    if (resetInProgress) return;
    const snap = await get(ref(db, "gameState/court"));
    const court = snap.val();
    if (!court || !court.active) return;

    let gCount = 0;
    let iCount = 0;
    Object.values(court.voters || {}).forEach(v => {
        if (v === "guilty") gCount++;
        if (v === "innocent") iCount++;
    });

    if (gCount > iCount) {
        sendSystemLog(`By a verdict of ${gCount} to ${iCount}, ${court.targetName} has been executed.`);
        
        let targetedPlayerRole = playersCache[court.targetId]?.role;
        if (targetedPlayerRole === "jester") {
            await update(ref(db, `users/${court.targetId}`), { alive: false });
            update(ref(db, "gameState"), { phase: "game_over", winnerMessage: `🃏 JESTER VICTORY! ${court.targetName.toUpperCase()} FOOLED THE TOWN AND TRIUMPHED!` });
            return;
        }

        await executePlayerDeath(court.targetId);
    } else {
        sendSystemLog(`By a verdict of ${iCount} to ${gCount}, ${court.targetName} has been found Innocent.`);
    }

    if (currentPhase !== "game_over" && !resetInProgress) {
        update(ref(db, "gameState"), {
            phase: "night",
            timer: 40,
            court: { active: false, targetId: "", targetName: "", guilty: 0, innocent: 0, voters: {} }
        });
    }
}

/* NIGHT PROCESSING RESOLUTION ENGINE */
async function processNightActions() {
    if (resetInProgress) return;
    const snap = await get(ref(db, "actions"));
    const acts = snap.val() || {};
    
    const gameGlobalSnap = await get(ref(db, "gameState"));
    const initialMatchCount = gameGlobalSnap.val()?.initialPlayerCount || Object.keys(playersCache).length;

    let interactionTargets = {}; 
    let frozenPlayers = new Set();
    let invisiblePlayers = new Set();
    let protectiveWards = new Set(); 
    let doctorSaves = new Set();
    let deadQueue = new Set();

    Object.entries(acts).forEach(([actorId, targetStr]) => {
        if (playersCache[actorId]?.alive) {
            interactionTargets[actorId] = targetStr;
        }
    });

    Object.entries(playersCache).forEach(([id, p]) => {
        if (p.role === "confusion vampire" && interactionTargets[id]) {
            let target = interactionTargets[id];
            if (interactionTargets[target]) {
                let pool = Object.keys(playersCache).filter(k => playersCache[k].alive && k !== target);
                if (pool.length > 0) {
                    interactionTargets[target] = pool[Math.floor(Math.random() * pool.length)];
                }
            }
        }
    });

    Object.entries(playersCache).forEach(([id, p]) => {
        if (p.role === "ice cream maker" && interactionTargets[id]) {
            let target = interactionTargets[id];
            frozenPlayers.add(target);
            delete interactionTargets[target]; 
        }
    });

    Object.entries(playersCache).forEach(([id, p]) => {
        if (p.role === "spirit artist" && interactionTargets[id]) {
            invisiblePlayers.add(interactionTargets[id]);
        }
    });

    Object.entries(playersCache).forEach(([id, p]) => {
        if (p.role === "doctor" && interactionTargets[id]) {
            doctorSaves.add(interactionTargets[id]);
        }
    });

    Object.entries(playersCache).forEach(([id, p]) => {
        if (p.role === "witch" && interactionTargets[id]) {
            let target = interactionTargets[id];
            if (witchPotionThisNight === "Invisibility Potion") {
                invisiblePlayers.add(target);
            } else if (witchPotionThisNight === "Poison Potion") {
                if (!doctorSaves.has(target)) {
                    deadQueue.add(target);
                } else {
                    sendSystemLog("A resident was saved by the Doctor from a deadly poison!");
                }
            }
        }
    });

    Object.keys(interactionTargets).forEach(actorId => {
        if (playersCache[actorId].role !== "witch" && playersCache[actorId].role !== "spirit artist" && invisiblePlayers.has(interactionTargets[actorId])) {
            delete interactionTargets[actorId];
        }
    });

    Object.entries(playersCache).forEach(([id, p]) => {
        if (p.role === "holy knight" && interactionTargets[id]) {
            protectiveWards.add(interactionTargets[id]);
        }
    });

    for (const [id, p] of Object.entries(playersCache)) {
        let choice = interactionTargets[id];
        if (!choice) continue;

        if (p.role === "inflator") {
            let currentBonus = playersCache[choice]?.voteBonusCount || 0;
            let finalBonus = currentBonus + 1;
            await update(ref(db, `users/${choice}`), { voteBonusCount: finalBonus });
            sendSystemLog(`🎈 AN INFLATOR EXPANDS A BALLOON! A hidden vote weight has been appended permanently to a resident.`);
            
            if (finalBonus === initialMatchCount) {
                update(ref(db, "gameState"), { phase: "game_over", winnerMessage: `🎈 INFLATOR VICTORY! ${p.name.toUpperCase()} INFLATED A RESIDENT'S WEIGHT TO MATCH INITIAL MATCH COUNT (${initialMatchCount}) EXACTLY!` });
                return;
            }
        }

        if (p.role === "dragoon") {
            deadQueue.add(choice);
            sendSystemLog(`🐉 THE DRAGON FEEDS: A resident was fed to the dragon tonight and incinerated.`);
            
            let preyRole = playersCache[choice]?.role;
            let preySide = ROLE_DATA[preyRole]?.side;
            
            if (preySide === "villager" || preyRole === "pokemon champion") {
                let cur = p.fedVills || 0;
                await update(ref(db, `users/${id}`), { fedVills: cur + 1 });
                p.fedVills = cur + 1;
            } else if (preySide === "vampire") {
                let cur = p.fedVamps || 0;
                await update(ref(db, `users/${id}`), { fedVamps: cur + 1 });
                p.fedVamps = cur + 1;
            }

            if ((p.fedVills || 0) >= 2 && (p.fedVamps || 0) >= 2) {
                update(ref(db, "gameState"), { phase: "game_over", winnerMessage: `🐉 DRAGOON VICTORY! ${p.name.toUpperCase()} SUCCESSFULLY FED 2 VILLAGERS AND 2 VAMPIRES TO THE DRAGON!` });
                return;
            }
        }

        if (p.role === "pokemon trainer") {
            let targetUnit = playersCache[choice];
            if (targetUnit && targetUnit.role === "vampire progenitor") {
                deadQueue.add(id);
                sendSystemLog(`🧢 A Pokémon Trainer wandered into the Progenitor's lair and was consumed.`);
            } else if (targetUnit) {
                p.pokeCount = (p.pokeCount || 0) + 1;
                if (p.pokeCount >= 5) {
                    update(ref(db, `users/${id}`), { role: "pokemon champion" });
                    sendSystemLog(`🏆 BREAKING NEWS: ${p.name.toUpperCase()} HAS CAUGHT 5 POKÉMON AND BECOME THE POKÉMON CHAMPION!`);
                }
            }
        }

        if (p.role === "pokemon champion") {
            deadQueue.add(choice);
        }

        if (p.role === "vampire progenitor") {
            let targetUnit = playersCache[choice];
            if (targetUnit && targetUnit.role === "rando") {
                deadQueue.add(id); 
                await update(ref(db, `users/${choice}`), { role: "vampire progenitor" }); 
                sendSystemLog(`🎲 RANDO TRAP TRIGGERED! The Vampire Progenitor attempted to bite the rando target, killing the Progenitor instantly! The rando transforms into the new Progenitor.`);
            } else {
                if (protectiveWards.has(choice)) {
                    sendSystemLog("The Holy Knight successfully repelled a lethal nocturnal assault!");
                } else if (doctorSaves.has(choice)) {
                    sendSystemLog("The Doctor successfully treated and saved the target of a brutal attack!");
                } else {
                    deadQueue.add(choice);
                }
            }
        }

        if (p.role === "hunter") {
            if (!doctorSaves.has(choice)) deadQueue.add(choice);
            let targetedUnit = playersCache[choice];
            if (targetedUnit && ROLE_DATA[targetedUnit.role]?.side === "villager") {
                deadQueue.add(id); 
                sendSystemLog(`Overcome with immediate remorse for striking an innocent villager, the Hunter commits suicide.`);
            }
        }
    }

    let progenitorDiedThisNight = false;

    for (let victimId of deadQueue) {
        if (playersCache[victimId]?.alive) {
            if (playersCache[victimId].role === "vampire progenitor") {
                progenitorDiedThisNight = true;
            }
            await update(ref(db, `users/${victimId}`), { alive: false });
            sendSystemLog(`💀 ${playersCache[victimId].name} was found dead when dawn broke.`);
            
            const willSnap = await get(ref(db, `wills/${victimId}`));
            const willData = willSnap.val();
            if (willData && willData.text) {
                sendSystemLog(`[LAST WILL OF ${willData.name.toUpperCase()}]: "${willData.text}"`);
            }
        }
    }

    if (deadQueue.size === 0) {
        sendSystemLog("Miraculously, everyone survived through the perilous night.");
    }

    if (progenitorDiedThisNight) {
        await handleVampireLineageSuccession();
    }

    await set(ref(db, "actions"), null);
    witchPotionThisNight = "";

    update(ref(db, "gameState"), {
        phase: "day_voting",
        timer: 100,
        court: { active: false, targetId: "", targetName: "", guilty: 0, innocent: 0, voters: {} }
    });
    
    verifyWinStateConditions();
}

function verifyWinStateConditions() {
    if (currentPhase === "game_over" || resetInProgress) return;
    if (!playersCache || Object.keys(playersCache).length <= 1) return;

    let aliveVamps = 0;
    let aliveTown = 0;

    Object.values(playersCache).forEach(p => {
        if (!p.alive) return;
        const side = ROLE_DATA[p.role]?.side;
        if (side === "vampire") aliveVamps++;
        if (side === "villager" || p.role === "pokemon champion") aliveTown++;
    });

    if (aliveVamps === 0) {
        update(ref(db, "gameState"), { phase: "game_over", winnerMessage: "VILLAGERS TRIUMPH! ALL VAMPIRES EXTERMINATED!" });
    } else if (aliveVamps >= aliveTown) {
        update(ref(db, "gameState"), { phase: "game_over", winnerMessage: "VAMPIRES WIN! THE VILLAGE HAS BEEN OVERRUN!" });
    }
}

function displayGameOverOverlay(msg) {
    const scr = document.getElementById("gameOverScreen");
    const banner = document.getElementById("victoryBanner");
    const manifestEl = document.getElementById("victoryManifest");
    
    if (scr && banner && manifestEl) {
        banner.textContent = msg;
        
        let villRows = "";
        let vampRows = "";
        let neutRows = "";
        
        Object.values(playersCache).forEach(p => {
            let side = ROLE_DATA[p.role]?.side || "neutral";
            if (p.role === "pokemon champion") side = "villager";
            
            let line = `<div class="manifest-player">• <b>${p.name}</b> — Role: <span style="text-transform:uppercase;">${p.role}</span> (${p.alive ? 'ALIVE' : 'ELIMINATED'})</div>`;
            
            if (side === "villager") villRows += line;
            else if (side === "vampire") vampRows += line;
            else neutRows += line;
        });
        
        manifestEl.innerHTML = `
            <h3 style="color:#fff; margin-top:0; border-bottom:1px solid #333; padding-bottom:10px;">FINAL SIMULATION ARCHIVE</h3>
            <div class="manifest-section vills"><h4>VILLAGER ALIGNMENT MATRIX</h4>${villRows || '<i>No registration data</i>'}</div>
            <div class="manifest-section vamps"><h4>VAMPIRE COVEN ALIGNMENT MATRIX</h4>${vampRows || '<i>No registration data</i>'}</div>
            <div class="manifest-section neuts"><h4>NEUTRAL ALIGNMENT MATRIX</h4>${neutRows || '<i>No registration data</i>'}</div>
        `;
        
        scr.style.display = "flex";
    }
}

/* TOTAL DESTRUCTIVE PURGE ENGINE ROUTINE */
function setupLobbyReturnRoute() {
    const btn = document.getElementById("returnToLobbyBtn");
    if (btn) {
        btn.onclick = async () => {
            resetInProgress = true;
            document.getElementById("gameOverScreen").style.display = "none";
            
            localStorage.removeItem("lastTarget_doctor");
            localStorage.removeItem("lastTarget_spirit artist");
            
            await remove(ref(db, "gameState"));
            await remove(ref(db, "actions"));
            await remove(ref(db, "votes"));
            await remove(ref(db, "mainChat"));
            await remove(ref(db, "vampChat"));
            await remove(ref(db, "wills"));
            
            const userSnap = await get(ref(db, "users"));
            const currentUsers = userSnap.val() || {};
            const cleanUserMap = {};
            
            Object.entries(currentUsers).forEach(([id, p]) => {
                if (id.startsWith("npc_") || id.includes("npc")) {
                    cleanUserMap[`users/${id}`] = null;
                } else {
                    cleanUserMap[`users/${id}`] = {
                        name: p.name || "Player",
                        room: "lobby",
                        alive: true,
                        ready: false,
                        avatar: p.avatar || "",
                        role: null,
                        voteBonusCount: null,
                        fedVills: null,
                        fedVamps: null
                    };
                }
            });
            
            await update(ref(db), cleanUserMap);
            window.location.href = "index.html";
        };
    }
}

function setupWiki() {
    const inp = document.getElementById("wikiInp");
    const btn = document.getElementById("wikiSend");
    const out = document.getElementById("wikiOut");

    if (!btn || !inp || !out) return;

    btn.onclick = () => {
        const query = inp.value.trim().toLowerCase();
        if (!query) return;

        if (query === "guide") {
            out.textContent = "GOLDI RULES SIMULATION SYSTEM:\nVillagers must deduce and eliminate all hidden threat factions.\nVampires look to execute target units silently during the night cycle.";
        } else if (ROLE_DATA[query]) {
            out.textContent = `CARD: ${ROLE_DATA[query].icon} ${query.toUpperCase()}\nAlignment: ${ROLE_DATA[query].side.toUpperCase()}\nDescription: ${ROLE_DATA[query].desc}`;
        } else {
            out.textContent = `No entry found matching keyword: "${query}"`;
        }
        inp.value = "";
    };
}
